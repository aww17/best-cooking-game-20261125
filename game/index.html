<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simmer &amp; Serve</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16100b; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #game { display: block; background: #16100b; box-shadow: 0 10px 40px rgba(0,0,0,0.45); border-radius: 10px; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0" aria-label="Simmer and Serve: a frantic cooking game. Click ingredients on the counter to build each ticket's dish, grill patties until cooked, and serve at the bell."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
